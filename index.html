<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SmartFarmasi AI</title>

<style>
body {
  font-family: Arial;
  background: #f0f8ff;
  text-align: center;
  padding: 30px;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 500px;
  margin: auto;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
  color: #2c3e50;
}

input, select, button {
  margin: 10px;
  padding: 10px;
  width: 80%;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  background: #3498db;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #2980b9;
}

#hasil, #reminder {
  margin-top: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<h1>💊 SmartFarmasi AI</h1>

<h3>Input Gejala</h3>
<select id="gejala">
  <option value="">-- Pilih Gejala --</option>
  <option value="demam">Demam</option>
  <option value="batuk">Batuk</option>
  <option value="diare">Diare</option>
  <option value="sakit_kepala">Sakit Kepala</option>
</select>

<button onclick="rekomendasi()">Cek Obat</button>

<div id="hasil"></div>

<hr>

<h3>Reminder Minum Obat ⏰</h3>
<input type="time" id="waktu">
<button onclick="setReminder()">Set Reminder</button>

<div id="reminder"></div>

</div>

<script>
function rekomendasi() {
  let gejala = document.getElementById("gejala").value;
  let hasil = "";

  switch(gejala) {
    case "demam":
      hasil = "Rekomendasi: Paracetamol 500 mg";
      break;
    case "batuk":
      hasil = "Rekomendasi: OBH / Dextromethorphan";
      break;
    case "diare":
      hasil = "Rekomendasi: Oralit + Loperamide";
      break;
    case "sakit_kepala":
      hasil = "Rekomendasi: Ibuprofen / Paracetamol";
      break;
    default:
      hasil = "Pilih gejala dulu!";
  }

  document.getElementById("hasil").innerText = hasil;
}

function setReminder() {
  let waktu = document.getElementById("waktu").value;
  
  if(!waktu) {
    alert("Masukkan waktu!");
    return;
  }

  document.getElementById("reminder").innerText =
    "Reminder diset jam " + waktu;

  setInterval(() => {
    let now = new Date();
    let jam = now.toTimeString().slice(0,5);

    if(jam === waktu) {
      alert("Waktunya minum obat!");
    }
  }, 1000);
}
</script>

</body>
</html>
